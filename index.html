<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    document.body.classList.toggle('light-theme', localStorage.getItem('tetris-theme') === 'light');
  </script>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-switch" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-row">
          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="70" height="70"></canvas>
          </div>
          <div class="panel-section">
            <span class="label">RESERVA</span>
            <canvas id="hold-canvas" width="70" height="70"></canvas>
          </div>
        </div>

        <div class="panel-row">
          <div class="panel-section">
            <span class="label">POWER-UP</span>
            <span class="value small" id="powerup-status"></span>
          </div>
          <div class="panel-section">
            <span class="label">COMBO</span>
            <span class="value small" id="combo-status">-</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-track"><div class="energy-fill" id="energy-fill"></div></div>
          <span class="value small" id="energy-status">0/100</span>
        </div>

        <div class="panel-section">
          <span class="label">VISIÓN</span>
          <canvas id="queue-canvas" width="56" height="210" hidden></canvas>
        </div>

        <div class="panel-section" id="challenge-status-section" hidden>
          <span class="label">DESAFÍO</span>
          <span class="value small" id="challenge-desc"></span>
          <span class="value small" id="challenge-progress"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>C</kbd> habilidad</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="skill-overlay" class="overlay hidden">
      <div class="overlay-box menu-box">
        <p id="skill-overlay-title">ELEGIR HABILIDAD</p>
        <div class="challenge-list">
          <button class="challenge-btn skill-btn" data-skill="peek">
            <strong>1. Ver siguientes 5 piezas</strong>
            <span>Revela la cola de piezas por 15s.</span>
          </button>
          <button class="challenge-btn skill-btn" data-skill="swap">
            <strong>2. Cambiar pieza</strong>
            <span>Cambia la pieza actual por otra al azar.</span>
          </button>
          <button class="challenge-btn skill-btn" data-skill="slow">
            <strong>3. Ralentizar tiempo</strong>
            <span>Reduce la velocidad de caída 10s.</span>
          </button>
          <button class="challenge-btn skill-btn" data-skill="undo">
            <strong>4. Deshacer última colocación</strong>
            <span>Revierte la última pieza fijada.</span>
          </button>
          <button class="challenge-btn skill-btn" data-skill="hold">
            <strong>5. Reservar pieza</strong>
            <span>Guarda la pieza actual para usar después.</span>
          </button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="menu-btn">Cambiar modo</button>
      </div>
    </div>

    <div id="menu-overlay" class="overlay">
      <div class="overlay-box menu-box">
        <p id="overlay-title">ELEGIR MODO</p>
        <div class="challenge-list">
          <button class="challenge-btn" data-challenge="">
            <strong>Modo normal</strong>
            <span>Tetris clásico, sin objetivo.</span>
          </button>
          <button class="challenge-btn" data-challenge="lines_time">
            <strong>Contrarreloj</strong>
            <span>Limpia 40 líneas en 2 minutos.</span>
          </button>
          <button class="challenge-btn" data-challenge="garbage">
            <strong>Basura ascendente</strong>
            <span>Sobrevive 90s con basura subiendo cada 10s.</span>
          </button>
          <button class="challenge-btn" data-challenge="preset">
            <strong>Bloques fijos</strong>
            <span>Empieza con el tablero medio lleno.</span>
          </button>
          <button class="challenge-btn" data-challenge="invisible">
            <strong>Piezas invisibles</strong>
            <span>La pieza se vuelve invisible al tocar la pila.</span>
          </button>
          <button class="challenge-btn" data-challenge="reverseRotation">
            <strong>Rotación inversa</strong>
            <span>Desde el nivel 3, la rotación se invierte.</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
